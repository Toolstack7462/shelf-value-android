name: Android beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Standalone exact-arithmetic checks
        run: ./tests/run-jvm.sh
      - name: Android lint and Kotlin/JVM unit tests
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Inspect package, target and permissions
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -F "package: name='com.shelfvalue.beta'" "$RUNNER_TEMP/badging.txt"
          grep -F "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          if grep -F 'android.permission.INTERNET' "$RUNNER_TEMP/permissions.txt"; then echo 'Unexpected INTERNET permission'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: shelf-value-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 emulator'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports-${{ github.sha }}
          path: app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
