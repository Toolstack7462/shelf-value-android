name: Android beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaged-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Standalone exact-arithmetic checks
        run: ./tests/run-jvm.sh
      - name: Assemble the debug application
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify the APK and record package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p verification
          echo "$GITHUB_SHA" > verification/commit.txt
          unzip -t "$apk" > verification/zip-integrity.txt
          "$sdk_tools/apksigner" verify --verbose --print-certs "$apk" | tee verification/signature.txt
          "$sdk_tools/aapt" dump badging "$apk" > verification/badging.txt
          "$sdk_tools/aapt" dump permissions "$apk" | tee verification/permissions.txt
          grep -F "package: name='com.shelfvalue.beta'" verification/badging.txt
          grep -F "sdkVersion:'24'" verification/badging.txt
          grep -F "targetSdkVersion:'36'" verification/badging.txt
          if grep -Fq 'android.permission.INTERNET' verification/permissions.txt; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
          (cd "$(dirname "$apk")" && sha256sum app-debug.apk) | tee verification/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: shelf-value-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build instrumentation APK, run Kotlin/JUnit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shelf-value-test-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ github.sha }}
          path: |
            verification/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shelf-value-debug-${{ github.sha }}
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: shelf-value-test-${{ github.sha }}
          path: packages
      - name: Enable KVM on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the uploaded APK and exercise English and Urdu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-reports-${{ github.sha }}
          path: emulator-reports/
          if-no-files-found: warn
          retention-days: 30
